syntax = "proto3";

package ledger.accounts.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/dyingvoid/ledger/pkg/proto/ledger/accounts/v1;accountsv1";

service AccountService {
  rpc CreateAccountInfo(CreateAccountInfoRequest) returns (CreateAccountInfoResponse);
  rpc OpenLedgerAccount(OpenLedgerAccountRequest) returns (OpenLedgerAccountResponse);
}

message CreateAccountInfoRequest {
  string id = 1;
  int64 user_id = 2;
  string name = 3;
  string description = 4;
  int32 type = 5;
  string currency = 6;
}

message CreateAccountInfoResponse {
  AccountInfo account = 1;
}

message OpenLedgerAccountRequest {
  string id = 1;
}

message OpenLedgerAccountResponse {
  AccountInfo account = 1;
}

message AccountInfo {
  string id = 1;
  int64 user_id = 2;
  string name = 3;
  string description = 4;
  int32 type = 5;
  string currency = 6;
  google.protobuf.Timestamp created_at = 7;
}
