name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/accounting/go.mod
          cache: true
          cache-dependency-path: |
            services/accounting/go.sum
            services/bff/go.sum

      - name: Download modules
        run: go work sync

      - name: Check formatting
        run: test -z "$(gofmt -l services)"

      - name: Check modules are tidy
        run: |
          go -C services/accounting mod tidy
          go -C services/bff mod tidy
          git diff --exit-code -- services/accounting/go.mod services/accounting/go.sum services/bff/go.mod services/bff/go.sum

      - name: Vet
        run: go vet ./services/accounting/... ./services/bff/...

      - name: Test
        run: go test -race ./services/accounting/... ./services/bff/...

      - name: Build
        run: go build ./services/accounting/... ./services/bff/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/accounting/go.mod
          cache: true
          cache-dependency-path: |
            services/accounting/go.sum
            services/bff/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: ./services/accounting/... ./services/bff/...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build accounting image
        run: docker build --file services/accounting/cmd/ledger/Dockerfile --tag accounting:ci .

      - name: Build BFF image
        run: docker build --file services/bff/cmd/bff/Dockerfile --tag bff:ci .
