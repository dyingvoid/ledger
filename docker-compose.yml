services:
  ledger:
    build:
      context: .
      dockerfile: cmd/ledger/Dockerfile
    environment:
      TIME_ZONE: ${TIME_ZONE:-UTC}
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-10}
      POSTGRES_MIN_CONNS: ${POSTGRES_MIN_CONNS:-0}
      POSTGRES_MAX_CONN_LIFETIME: ${POSTGRES_MAX_CONN_LIFETIME:-1h}
      POSTGRES_MAX_CONN_IDLE_TIME: ${POSTGRES_MAX_CONN_IDLE_TIME:-30m}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-5s}
      TIGERBEETLE_CLUSTER_ID: ${TIGERBEETLE_CLUSTER_ID:-0}
      TIGERBEETLE_ADDRESSES: ${TIGERBEETLE_IP:-172.28.0.2}:3000
      IDEMPOTENCY_TTL: ${IDEMPOTENCY_TTL:-24h}
      GRPC_ADDR: ${GRPC_ADDR:-:50051}
    depends_on:
      postgres:
        condition: service_healthy
      tigerbeetle:
        condition: service_started
    ports:
      - "${GRPC_PORT:-50051}:50051"
    security_opt:
      - seccomp=unconfined

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: [ "postgres", "-c", "max_connections=${POSTGRES_MAX_CONNS}" ]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /data/0_0.tigerbeetle ]; then
          /tigerbeetle format --cluster=${TIGERBEETLE_CLUSTER_ID:-0} --replica=0 --replica-count=1 --development /data/0_0.tigerbeetle
        fi
        exec /tigerbeetle start --addresses=0.0.0.0:3000 --development /data/0_0.tigerbeetle
    ports:
      - "${TIGERBEETLE_PORT:-3000}:3000"
    volumes:
      - tigerbeetle-data:/data
    security_opt:
      - seccomp=unconfined
    networks:
      default:
        ipv4_address: ${TIGERBEETLE_IP:-172.28.0.2}

  migrate:
    image: migrate/migrate:v4.19.1
    profiles: [ "migrations" ]
    environment:
      PGOPTIONS: "-c lock_timeout=${MIGRATE_LOCK_TIMEOUT:-5}s"
    volumes:
      - ${PROJECT_ROOT:-.}/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy

  lint:
    image: golangci/golangci-lint:${GOLANGCI_LINT_VERSION:-v2.15.0}
    profiles: [ "lint" ]
    entrypoint: [ "golangci-lint" ]
    command: [ "run", "./..." ]
    working_dir: /app
    volumes:
      - ${PROJECT_ROOT:-.}:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/16}

volumes:
  postgres-data:
  tigerbeetle-data:
  go-mod-cache:
  go-build-cache:
