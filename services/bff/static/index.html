<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledger account workflow</title>
  <script>
    (() => {
      let theme;
      try {
        theme = localStorage.getItem("ledger-theme");
      } catch {
        theme = null;
      }

      if (theme !== "dark" && theme !== "light") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }

      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f1ea;
      --surface: #fffdf8;
      --surface-strong: #f0eadc;
      --text: #1f2924;
      --muted: #69736d;
      --border: #d9d2c2;
      --accent: #22684b;
      --accent-strong: #184b36;
      --on-accent: #ffffff;
      --error: #a6382e;
      --warning: #a9660b;
      --success: #24734f;
      --shadow: 0 18px 60px rgb(42 50 44 / 10%);
      --glow: rgb(34 104 75 / 10%);
      --input-background: #ffffff;
      --endpoint-background: rgb(255 253 248 / 70%);
      --focus-ring: rgb(34 104 75 / 14%);
      --running-background: #fff3dc;
      --success-background: #e7f5ed;
      --failure-background: #fbe9e7;
      --code-border: #29342e;
      --code-background: #17201b;
      --code-text: #dce8df;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #0f1612;
      --surface: #18211c;
      --surface-strong: #222e27;
      --text: #edf5ef;
      --muted: #9eaea5;
      --border: #35463c;
      --accent: #74c99d;
      --accent-strong: #91d9b0;
      --on-accent: #0c1811;
      --error: #ff9489;
      --warning: #f4bd67;
      --success: #7bd6aa;
      --shadow: 0 20px 70px rgb(0 0 0 / 30%);
      --glow: rgb(116 201 157 / 11%);
      --input-background: #111a15;
      --endpoint-background: rgb(24 33 28 / 82%);
      --focus-ring: rgb(116 201 157 / 20%);
      --running-background: #3b2e18;
      --success-background: #1c3b2c;
      --failure-background: #402421;
      --code-border: #3b5948;
      --code-background: #0a100c;
      --code-text: #d9ebe0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at top left, var(--glow), transparent 35rem),
        var(--background);
      color: var(--text);
      font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background-color 160ms ease, color 160ms ease;
    }

    main {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif;
      font-size: clamp(2rem, 5vw, 3.7rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .intro {
      max-width: 36rem;
      margin: 10px 0 0;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .endpoint {
      flex: none;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--endpoint-background);
      color: var(--muted);
      font: 0.78rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .theme-toggle {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 4px 16px rgb(0 0 0 / 5%);
    }

    .theme-toggle:hover:not(:disabled) {
      background: var(--surface-strong);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
      gap: 20px;
      align-items: start;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    form {
      padding: 24px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .field-wide {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .hint {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 400;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--input-background);
      color: var(--text);
      font: inherit;
      outline: none;
      padding: 11px 12px;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    input[readonly] {
      background: var(--surface-strong);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
    }

    .inline-field {
      display: flex;
      gap: 8px;
    }

    .inline-field input {
      min-width: 0;
    }

    button {
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font: 700 0.88rem/1 ui-sans-serif, system-ui, sans-serif;
      padding: 12px 16px;
      transition: background 120ms ease, transform 120ms ease, opacity 120ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .primary {
      width: 100%;
      margin-top: 24px;
      background: var(--accent);
      color: var(--on-accent);
    }

    .primary:hover:not(:disabled) {
      background: var(--accent-strong);
    }

    .secondary {
      border: 1px solid var(--border);
      background: var(--surface-strong);
      color: var(--text);
      white-space: nowrap;
    }

    .result {
      overflow: hidden;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
    }

    .result-header h2 {
      margin: 0;
      font-size: 1rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 750;
      padding: 6px 10px;
    }

    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    .status.running {
      background: var(--running-background);
      color: var(--warning);
    }

    .status.running::before {
      animation: pulse 1.2s ease-in-out infinite;
    }

    .status.success {
      background: var(--success-background);
      color: var(--success);
    }

    .status.failure {
      background: var(--failure-background);
      color: var(--error);
    }

    @keyframes pulse {
      50% {
        opacity: 0.25;
      }
    }

    .result-body {
      padding: 20px 22px 22px;
    }

    .operation {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 6px 12px;
      margin-bottom: 18px;
      font-size: 0.78rem;
    }

    .operation dt {
      color: var(--muted);
    }

    .operation dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .response {
      min-height: 150px;
      max-height: 340px;
      margin: 0;
      overflow: auto;
      border: 1px solid var(--code-border);
      border-radius: 12px;
      background: var(--code-background);
      color: var(--code-text);
      font: 0.78rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      padding: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message {
      min-height: 1.5em;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .message.error {
      color: var(--error);
    }

    .result-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }

    @media (max-width: 820px) {
      main {
        padding-top: 32px;
      }

      header {
        align-items: start;
        flex-direction: column;
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      main {
        width: min(100% - 20px, 1080px);
      }

      .field-grid {
        grid-template-columns: 1fr;
      }

      form,
      .result-body {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">BFF operations</p>
        <h1>Create account</h1>
        <p class="intro">
          Start the existing account-opening workflow and follow its status from the browser.
        </p>
      </div>
      <div class="header-actions">
        <code class="endpoint">POST /v1/accounts</code>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
          Dark theme
        </button>
      </div>
    </header>

    <div class="layout">
      <section class="card" aria-labelledby="create-heading">
        <form id="account-form">
          <h2 id="create-heading" class="sr-only">Account details</h2>
          <div class="field-grid">
            <div class="field">
              <label for="user-id">User ID</label>
              <input id="user-id" name="user_id" type="number" min="1" value="1000" required>
            </div>

            <div class="field">
              <label for="currency">Currency</label>
              <input
                id="currency"
                name="currency"
                type="text"
                value="USD"
                list="currencies"
                maxlength="16"
                required
              >
              <datalist id="currencies">
                <option value="USD"></option>
                <option value="CNY"></option>
                <option value="RUB"></option>
              </datalist>
            </div>

            <div class="field field-wide">
              <label for="account-name">Name</label>
              <input id="account-name" name="name" type="text" value="Main account" required>
            </div>

            <div class="field field-wide">
              <label for="description">
                Description
                <span class="hint">optional</span>
              </label>
              <textarea
                id="description"
                name="description"
                placeholder="Created from the local BFF test page"
              ></textarea>
            </div>

            <div class="field">
              <label for="account-type">
                Account type
                <span class="hint">1000–5999</span>
              </label>
              <input
                id="account-type"
                name="type"
                type="number"
                min="1000"
                max="5999"
                value="2100"
                list="account-types"
                required
              >
              <datalist id="account-types">
                <option value="1000">Bank cash</option>
                <option value="2100">Client deposit</option>
                <option value="3000">Equity</option>
                <option value="4000">Revenue</option>
                <option value="5000">Expense</option>
              </datalist>
            </div>

            <div class="field">
              <label for="idempotency-key">
                Idempotency key
                <span class="hint">safe to retry</span>
              </label>
              <div class="inline-field">
                <input id="idempotency-key" name="idempotency_key" type="text" readonly required>
                <button id="new-key" class="secondary" type="button">New</button>
              </div>
            </div>
          </div>

          <button id="create-button" class="primary" type="submit">
            Create account and follow workflow
          </button>
        </form>
      </section>

      <section class="card result" aria-live="polite">
        <div class="result-header">
          <h2>Workflow result</h2>
          <span id="status" class="status">Idle</span>
        </div>

        <div class="result-body">
          <dl class="operation">
            <dt>Operation</dt>
            <dd id="operation-id">Not started</dd>
            <dt>Poll</dt>
            <dd id="poll-path">GET /v1/accounts/{operation_id}</dd>
          </dl>

          <pre id="response" class="response" aria-label="Raw workflow response">{}</pre>
          <p id="message" class="message">Fill in the form to start an account-opening workflow.</p>

          <div class="result-actions">
            <button id="refresh-button" class="secondary" type="button" disabled>
              Fetch latest result
            </button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const form = document.querySelector("#account-form");
    const themeToggle = document.querySelector("#theme-toggle");
    const createButton = document.querySelector("#create-button");
    const refreshButton = document.querySelector("#refresh-button");
    const newKeyButton = document.querySelector("#new-key");
    const idempotencyInput = document.querySelector("#idempotency-key");
    const statusElement = document.querySelector("#status");
    const operationIdElement = document.querySelector("#operation-id");
    const pollPathElement = document.querySelector("#poll-path");
    const responseElement = document.querySelector("#response");
    const messageElement = document.querySelector("#message");

    let operationId = "";
    let pollTimer;
    let pollDelay = 1200;

    function applyTheme(theme, persist = true) {
      const isDark = theme === "dark";
      document.documentElement.dataset.theme = isDark ? "dark" : "light";
      themeToggle.textContent = isDark ? "☀ Light theme" : "☾ Dark theme";
      themeToggle.setAttribute("aria-pressed", String(isDark));
      themeToggle.setAttribute(
        "aria-label",
        isDark ? "Switch to light theme" : "Switch to dark theme",
      );

      if (!persist) {
        return;
      }

      try {
        localStorage.setItem("ledger-theme", isDark ? "dark" : "light");
      } catch {
        // The theme still applies for this page view when storage is unavailable.
      }
    }

    function newIdempotencyKey() {
      if (typeof crypto.randomUUID === "function") {
        return `browser-${crypto.randomUUID()}`;
      }
      return `browser-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function setStatus(label, state = "") {
      statusElement.textContent = label;
      statusElement.className = `status ${state}`.trim();
    }

    function setMessage(text, isError = false) {
      messageElement.textContent = text;
      messageElement.classList.toggle("error", isError);
    }

    function showOperation(operation) {
      operationId = operation.operation_id || operationId;
      operationIdElement.textContent = operationId || "Not started";
      pollPathElement.textContent = operationId
        ? `GET /v1/accounts/${operationId}`
        : "GET /v1/accounts/{operation_id}";
      refreshButton.disabled = !operationId;

      switch (operation.status) {
        case "in_progress":
          setStatus("Running", "running");
          break;
        case "success":
          setStatus("Succeeded", "success");
          break;
        case "failure":
          setStatus("Failed", "failure");
          break;
        default:
          setStatus(operation.status || "Unknown");
      }
    }

    async function requestJSON(path, options) {
      const response = await fetch(path, options);
      const text = await response.text();
      let data = {};

      if (text) {
        try {
          data = JSON.parse(text);
        } catch {
          data = { response: text };
        }
      }

      if (!response.ok) {
        const detail = typeof data.response === "string"
          ? data.response.trim()
          : text.trim();
        throw new Error(`HTTP ${response.status}${detail ? `: ${detail}` : ""}`);
      }

      return data;
    }

    function schedulePoll() {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(checkOperation, pollDelay);
      pollDelay = Math.min(pollDelay + 800, 5000);
    }

    async function checkOperation() {
      if (!operationId) {
        return;
      }

      clearTimeout(pollTimer);
      refreshButton.disabled = true;

      try {
        const operation = await requestJSON(
          `/v1/accounts/${encodeURIComponent(operationId)}`,
          { headers: { Accept: "application/json" } },
        );
        showOperation(operation);
        responseElement.textContent = JSON.stringify(operation, null, 2);

        if (operation.status === "in_progress") {
          setMessage("The worker is still processing this workflow. Checking again automatically.");
          schedulePoll();
          return;
        }

        setMessage(
          operation.status === "success"
            ? "The account-opening workflow completed successfully."
            : "The account-opening workflow stopped. Review the raw result.",
          operation.status === "failure",
        );
        refreshButton.disabled = false;
      } catch (error) {
        setStatus("Check failed", "failure");
        setMessage(error.message, true);
        refreshButton.disabled = false;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearTimeout(pollTimer);
      pollDelay = 1200;
      createButton.disabled = true;
      refreshButton.disabled = true;
      setStatus("Starting", "running");
      setMessage("Submitting the account-opening workflow...");
      responseElement.textContent = "{}";

      const formData = new FormData(form);
      const payload = {
        user_id: Number(formData.get("user_id")),
        name: String(formData.get("name")).trim(),
        description: String(formData.get("description")).trim(),
        type: Number(formData.get("type")),
        currency: String(formData.get("currency")).trim().toUpperCase(),
      };

      try {
        const operation = await requestJSON("/v1/accounts", {
          method: "POST",
          headers: {
            Accept: "application/json",
            "Content-Type": "application/json",
            "Idempotency-Key": idempotencyInput.value,
          },
          body: JSON.stringify(payload),
        });

        showOperation(operation);
        responseElement.textContent = JSON.stringify(operation, null, 2);
        setMessage("Workflow started. Waiting for its result...");
        createButton.disabled = false;

        if (operation.status === "in_progress") {
          schedulePoll();
        } else {
          refreshButton.disabled = false;
          setMessage(
            operation.status === "success"
              ? "The account-opening workflow completed successfully."
              : "The account-opening workflow stopped. Review the raw result.",
            operation.status === "failure",
          );
        }
      } catch (error) {
        setStatus("Failed to start", "failure");
        setMessage(error.message, true);
        createButton.disabled = false;
        refreshButton.disabled = !operationId;
      }
    });

    newKeyButton.addEventListener("click", () => {
      idempotencyInput.value = newIdempotencyKey();
    });

    themeToggle.addEventListener("click", () => {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(nextTheme);
    });

    refreshButton.addEventListener("click", () => {
      pollDelay = 1200;
      checkOperation();
    });

    applyTheme(document.documentElement.dataset.theme, false);
    idempotencyInput.value = newIdempotencyKey();
  </script>
</body>
</html>
